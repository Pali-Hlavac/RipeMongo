[package]
name = "ripemongo"
version = "0.1.0"
description = "RipeMongo - a fast, cross-platform MongoDB GUI"
authors = ["RipeMongo contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "ripemongo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
