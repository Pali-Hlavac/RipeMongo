[package]
name = "ripemongo"
version = "0.1.0"
description = "RipeMongo - a fast, cross-platform MongoDB GUI"
authors = ["RipeMongo contributors"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "ripemongo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
flate2 = "1"
futures-util = "0.3.34"
keyring = "4"
mongodb = { version = "3.9.1", features = ["aws-auth", "azure-oidc", "gcp-oidc", "cert-key-password", "zstd-compression", "snappy-compression", "zlib-compression"] }
percent-encoding = "2.3.2"
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tempfile = "3.27.0"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "process"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
dbg_macro = "deny"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

[dev-dependencies]
testcontainers-modules = { version = "0.15", features = ["mongo"] }
